name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Set SIGNPATH_ORGANIZATION_ID repo variable and SIGNPATH_API_TOKEN secret once SignPath approves the project.
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Build UI & test Rust workspace
        run: |
          Push-Location src-ui
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed" }
          Pop-Location
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          cargo test --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Publish release binary to dist/stage
        run: ./scripts/build-installer.ps1 -PublishOnly
        shell: pwsh

      # ---- sign CSVRescue.exe before packaging installer & portable archive
      - name: Collect binaries to sign
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/unsigned | Out-Null
          Copy-Item dist/stage/CSVRescue.exe dist/unsigned
      - name: Upload binaries
        if: env.SIGN == 'true'
        id: upload-binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-unsigned
          path: dist/unsigned/*
      - name: Sign binaries
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: csvrescue
          signing-policy-slug: release-signing
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
      - name: Replace with signed binaries
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item dist/signed/* dist/stage -Force

      - name: Build installer
        run: ./scripts/build-installer.ps1 -SkipPublish
        shell: pwsh

      # ---- sign the installer
      - name: Upload installer
        if: env.SIGN == 'true'
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-unsigned
          path: dist/installer/CSVRescue-Setup-*.exe
      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: csvrescue
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-installer
      - name: Replace with signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item dist/signed-installer/CSVRescue-Setup-*.exe dist/installer -Force

      - name: Package release files
        shell: pwsh
        run: |
          $cargoToml = Get-Content Cargo.toml -Raw
          if (-not ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"')) { throw 'Version not found in Cargo.toml' }
          $v = $Matches[1]
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item "dist/installer/CSVRescue-Setup-$v.exe" dist/release
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/release/CSVRescue-$v-win64-portable.zip" -CompressionLevel Optimal -Force
          # LF endings so `sha256sum -c` works on Linux and macOS too
          $sums = Get-ChildItem dist/release -File | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllText("$PWD/dist/release/SHA256SUMS.txt", ($sums -join "`n") + "`n")

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $notes = "docs/release-notes-$v.md"
          if (-not (Test-Path $notes)) { throw "Missing $notes - write the release notes before tagging" }
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/release/* --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
            gh release edit $tag --title "CSVRescue $v" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
          } else {
            gh release create $tag dist/release/* --title "CSVRescue $v" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          }
